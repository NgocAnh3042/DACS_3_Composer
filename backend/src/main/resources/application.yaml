spring:
  application:
    name: backend
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 1
  datasource:
    hikari:
      maximum-pool-size: 5
      max-lifetime: 300000
      connection-timeout: 10000
  jackson:
    default-property-inclusion: non_null
server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
foodhub:
  delivery-fee: ${DELIVERY_FEE:15000}
  database:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    ca-cert: ${DB_CA_CERT:certs/isrgrootx1.pem}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID}
